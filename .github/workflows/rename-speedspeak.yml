name: Rename SpeedSpeak in portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-speedspeak.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename project display name
        run: |
          sed -i 's/Instant English Composition/SpeedSpeak/g' src/en/portfolio/index.njk
          sed -i 's/Speed Speak/SpeedSpeak/g' src/ja/portfolio/index.njk

          grep -q '<h3>SpeedSpeak</h3>' src/en/portfolio/index.njk
          grep -q '<h3>SpeedSpeak</h3>' src/ja/portfolio/index.njk

          if grep -q 'Instant English Composition' src/en/portfolio/index.njk; then
            echo 'Old English display name still remains.' >&2
            exit 1
          fi

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/rename-speedspeak.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/en/portfolio/index.njk src/ja/portfolio/index.njk .github/workflows/rename-speedspeak.yml
          git commit -m 'fix: rename portfolio app to SpeedSpeak'
          git push origin HEAD:main
