name: Refresh portfolio lockfile

on:
  push:
    branches: [maintenance/portfolio-hardening]
    paths:
      - package.json
      - .github/workflows/update-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maintenance/portfolio-hardening

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile and apply non-breaking audit fixes
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts

      - name: Validate install, audit, and build
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "deps: refresh Eleventy lockfile"
          git push origin HEAD:maintenance/portfolio-hardening
